name: General issue
description: Bugs, questions, or anything that is not a consumer registration request.
body:
  - type: markdown
    attributes:
      value: |
        Requesting event delivery for a club? Use **[Register as a consumer](https://github.com/terijaki/sams-provider/issues/new?template=consumer-registration.yml)** instead.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Bug
        - Question
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What happened, what you expected, or what you need.
    validations:
      required: true
