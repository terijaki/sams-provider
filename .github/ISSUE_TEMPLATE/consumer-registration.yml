name: Register as a consumer
description: Request production event delivery for your club after the SQS queue exists in your AWS account.
title: "Register: "
labels: ["registration"]
body:
  - type: markdown
    attributes:
      value: |
        Public consumers are registered on the **production** provider only (`550271577754` in `eu-central-1`).

        Deploy the queue and policy first, then file this issue. The checklist and resource names are in the [README](https://github.com/terijaki/sams-provider#get-events-for-your-club).
  - type: input
    id: club
    attributes:
      label: Club name or SAMS UUID
      description: Exact club name as it appears in SAMS, or the 36-character club UUID if the name is ambiguous.
      placeholder: Example Volleyball Club
    validations:
      required: true
  - type: input
    id: account-id
    attributes:
      label: AWS account ID
      description: 12-digit AWS account that owns the queue.
      placeholder: "123456789012"
    validations:
      required: true
  - type: input
    id: queue-arn
    attributes:
      label: Queue ARN (if not the default name)
      description: Leave empty if the queue is named `sams-provider-events` in `eu-central-1`. Otherwise paste the full SQS ARN.
      placeholder: arn:aws:sqs:eu-central-1:123456789012:sams-provider-events
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Confirm these are done in your AWS account. Registration cannot create the queue for you.
      options:
        - label: An SQS queue named `sams-provider-events` exists in `eu-central-1` (or I supplied a different queue ARN above).
          required: true
        - label: A dead-letter queue is attached to that queue.
          required: true
        - label: The queue policy allows `events.amazonaws.com` to `sqs:SendMessage`, conditioned on `arn:aws:events:eu-central-1:550271577754:event-bus/sams-provider` (and source account `550271577754`).
          required: true
        - label: I understand there is no public read API; my app will consume events from this queue.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional. Contact details, extra AWS accounts, or anything else the maintainer should know.
