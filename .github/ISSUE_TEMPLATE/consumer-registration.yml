name: Register as a consumer
description: Request event delivery for your club. Deploy the SQS queue first.
title: "Register: "
labels: ["registration"]
body:
  - type: markdown
    attributes:
      value: |
        Queue setup is in the [README](https://github.com/terijaki/sams-provider#get-events-for-your-club).
  - type: input
    id: club
    attributes:
      label: Club name or SAMS UUID
      description: Exact club name as it appears in SAMS, or the 36-character club UUID if the name is ambiguous.
      placeholder: Example Volleyball Club
    validations:
      required: true
  - type: input
    id: account-id
    attributes:
      label: AWS account ID
      description: 12-digit AWS account that owns the queue.
      placeholder: "123456789012"
    validations:
      required: true
  - type: input
    id: queue-arn
    attributes:
      label: Queue ARN (if not the default name)
      description: Leave empty if the queue is named `sams-provider-events` in `eu-central-1`. Otherwise paste the full SQS ARN.
      placeholder: arn:aws:sqs:eu-central-1:123456789012:sams-provider-events
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Confirm these already exist in your AWS account.
      options:
        - label: Queue `sams-provider-events` exists in `eu-central-1` (or I supplied a different queue ARN above).
          required: true
        - label: A dead-letter queue is attached to that queue.
          required: true
        - label: The queue policy matches the README (the provider event bus can send messages).
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional. Contact details, extra AWS accounts, or anything else we should know.
