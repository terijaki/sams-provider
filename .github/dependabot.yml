version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      aws:
        patterns:
          - "@aws-sdk/*"
          - "@aws-lambda-powertools/*"
          - "@smithy/*"
          - "aws-xray-sdk-core"
          - "aws-cdk*"
          - "aws-sdk-client-mock"
          - "constructs"
          - "@types/aws-lambda"
      platform:
        patterns:
          - "dynamodb-toolbox"
          - "varlock"
          - "@varlock/*"
          - "zod"
          - "@middy/*"
          - "dayjs"
          - "sams-rest-v2"
      toolchain:
        patterns:
          - "@voidzero-dev/*"
          - "esbuild"
          - "tsx"
          - "typescript"
          - "vite"
          - "*vite*"
          - "vite-plus"
          - "@types/*"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
