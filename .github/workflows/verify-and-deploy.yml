name: Verify and Deploy

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".vscode/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      VARLOCK_ENV: test
      CDK_ENVIRONMENT: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'prod' || 'dev' }}
      CDK_STACK_GROUP: app
      CDK_BRANCH_OVERWRITE: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "25"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Lint, format, and typecheck
        run: vp check

      - name: Run tests
        run: vp test

      - name: CDK synth app stacks
        run: vp exec cdk synth

      # PRs synth the feature-branch app (no Monitoring). Always synth prod too
      # so MonitoringStack-Prod construct IDs are validated before merge.
      - name: CDK synth prod app stacks
        if: env.CDK_ENVIRONMENT != 'prod'
        env:
          CDK_ENVIRONMENT: prod
        run: vp exec cdk synth

      - name: CDK synth shared stacks
        env:
          CDK_STACK_GROUP: shared
        run: vp exec cdk synth

  deploy:
    name: Deploy CDK to AWS
    needs: verify
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'prod' || 'dev' }}
    concurrency:
      group: deploy-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'prod' || (github.event_name == 'pull_request' && github.head_ref || github.ref_name) }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write
    env:
      CDK_ENVIRONMENT: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'prod' || 'dev' }}
      CDK_STACK_GROUP: app
      CDK_BRANCH_OVERWRITE: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "25"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Require AWS role ARN
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::GitHub Environment secret AWS_ROLE_ARN is missing. Set it on the ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'prod' || 'dev' }} environment."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Load environment variables
        uses: dmno-dev/varlock-action@v1.0.5

      - name: CDK Diff
        run: vp exec cdk diff --all

      - name: CDK Deploy
        run: vp exec cdk deploy --require-approval never --all --outputs-file cdk-outputs.json

      - name: CDK Diff shared stacks
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CDK_STACK_GROUP: shared
        run: vp exec cdk diff --all

      - name: CDK Deploy shared stacks
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CDK_STACK_GROUP: shared
        run: vp exec cdk deploy --require-approval never --all

      - name: Add deployment summary
        run: |
          echo "## ${{ github.ref == 'refs/heads/main' && 'Production' || 'Development' }} CDK Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **GitHub Environment** | \`${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'prod' || 'dev' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **CDK_ENVIRONMENT** | \`${{ env.CDK_ENVIRONMENT }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
