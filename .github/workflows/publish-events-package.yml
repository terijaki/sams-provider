name: Publish events package

on:
  push:
    branches: [main]
    paths:
      - "packages/sams-provider-events/**"
      - ".github/workflows/publish-events-package.yml"

permissions:
  contents: read

concurrency:
  group: publish-events-package
  cancel-in-progress: false

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "25"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Check
        run: vp check

      - name: Test
        run: vp test

      - name: Pack events package
        run: vp --cwd packages/sams-provider-events pack

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sams-provider-events
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "25"
          cache: true

      - name: Install dependencies
        run: vp install

      - uses: actions/setup-node@v7
        with:
          node-version: "25"
          registry-url: https://registry.npmjs.org

      - name: Pack
        run: vp pack

      - name: Publish
        run: npm publish --access public --provenance

      - name: Create git tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="sams-provider-events-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping tag creation."
            exit 0
          fi
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --generate-notes
