name: Publish events package

on:
  push:
    branches: [main]
    paths:
      - "packages/sams-provider-events/package.json"
      - "packages/sams-provider-events/src/constants.ts"
      - "packages/sams-provider-events/src/schemas.ts"
      - "packages/sams-provider-events/src/types.ts"
      - ".github/workflows/publish-events-package.yml"

permissions:
  contents: read

concurrency:
  group: publish-events-package
  cancel-in-progress: false

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "25"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Check
        run: vp check

      - name: Test
        run: vp test

      - name: Pack events package
        run: cd packages/sams-provider-events && vp pack

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sams-provider-events
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "25"
          cache: true

      - name: Install dependencies
        run: vp install

      - uses: actions/setup-node@v7
        with:
          node-version: "25"
          registry-url: https://registry.npmjs.org

      - name: Pack
        run: vp pack

      - name: Publish when version is new
        id: publish
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view sams-provider-events version 2>/dev/null || echo "0.0.0")
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "Version $LOCAL is already on npm; skipping publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node -e "
            const local = process.argv[1].split('.').map(Number);
            const published = process.argv[2].split('.').map(Number);
            for (let i = 0; i < 3; i++) {
              if (local[i] > published[i]) process.exit(0);
              if (local[i] < published[i]) {
                console.error('Local version is lower than npm; refusing to publish.');
                process.exit(1);
              }
            }
            console.error('Local version equals npm; refusing to publish.');
            process.exit(1);
          " "$LOCAL" "$PUBLISHED"
          npm publish --access public --provenance
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Create git tag
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="sams-provider-events-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping tag creation."
            exit 0
          fi
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --generate-notes
