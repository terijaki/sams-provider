name: CDK Deploy
concurrency:
  group: cdk-deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".vscode/**"

permissions:
  id-token: write
  contents: write

jobs:
  deploy:
    name: Deploy CDK Stack
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      CDK_ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "25"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Require AWS role ARN
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::GitHub Environment secret AWS_ROLE_ARN is missing. Set it on the ${{ github.ref_name == 'main' && 'prod' || 'dev' }} environment."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Load environment variables
        uses: dmno-dev/varlock-action@v1.0.5

      - name: Lint check
        run: vp lint

      - name: Run tests
        run: vp test

      # App stacks only (CDK_STACK_GROUP=app). Shared OIDC + Budget stay local.
      - name: CDK Diff
        run: vp exec cdk diff --all

      - name: CDK Deploy
        run: vp exec cdk deploy --require-approval never --all --outputs-file cdk-outputs.json

      - name: Add deployment summary
        run: |
          echo "## ${{ github.ref == 'refs/heads/main' && '🚀' || '🔧' }} CDK Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **GitHub Environment** | \`${{ github.ref_name == 'main' && 'prod' || 'dev' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **CDK_ENVIRONMENT** | \`${{ env.CDK_ENVIRONMENT }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
